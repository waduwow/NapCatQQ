name: Sync Upstream

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into fork
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const r = await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main'
              });
              core.info('结果: ' + r.data.message);
              core.info('类型: ' + (r.data.merge_type || 'none'));
            } catch (e) {
              core.setFailed('同步失败: ' + e.message);
            }
